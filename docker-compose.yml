services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: telocc
      POSTGRES_PASSWORD: telocc
      POSTGRES_DB: telocc
    ports:
      - "54329:5432"
    volumes:
      - telocc_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telocc -d telocc"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  telocc_pg_data:
